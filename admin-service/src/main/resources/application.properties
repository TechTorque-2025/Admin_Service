spring.application.name=admin-service

server.port=8087

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:techtorque_admin}
spring.datasource.username=${DB_USER:techtorque}
spring.datasource.password=${DB_PASS:techtorque123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DB_MODE:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Development/Production Profile
spring.profiles.active=${SPRING_PROFILE:dev}

# OpenAPI access URL
# http://localhost:8087/swagger-ui/index.html

# Microservices URLs
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.vehicle.url=${VEHICLE_SERVICE_URL:http://localhost:8082}
services.appointment.url=${APPOINTMENT_SERVICE_URL:http://localhost:8083}
services.project.url=${PROJECT_SERVICE_URL:http://localhost:8084}
services.time-logging.url=${TIME_LOGGING_SERVICE_URL:http://localhost:8085}
services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8086}

# WebClient Configuration
spring.webflux.timeout=30s